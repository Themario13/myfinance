name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Poner la dirección de retorno del banco
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/callback.html"
          URL=$(echo "$URL" | tr '[:upper:]' '[:lower:]')
          sed -i "s#__REDIRECT_URL__#${URL}#g" www/index.html
          echo "Redirect URL: $URL"

      - name: Copiar la web a Android
        run: npx cap sync android

      - name: Clave de firma fija (para poder actualizar sin perder datos)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Usando la clave de firma guardada"
          else
            echo "::warning::No hay ANDROID_KEYSTORE_B64; cada APK tendrá una firma distinta"
          fi

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MisCuentas.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mis Cuentas v${{ github.run_number }}
          body: Descarga **MisCuentas.apk** desde el móvil e instálalo.
          files: MisCuentas.apk
          make_latest: true
