<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f5f6f8">
<title>Mis Cuentas</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#eceef2; --soft:#f1f3f6;
  --text:#14171f; --muted:#6b7280; --faint:#9aa1ad;
  --accent:#0e9f6e; --accent-soft:#e6f6ef;
  --exp:#e5484d; --exp-soft:#fdecec; --inc:#0e9f6e; --warn:#d97706; --warn-soft:#fdf3e2;
  --r:18px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 8px rgba(16,24,40,.04);
  --top:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --bot:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:10;background:rgba(245,246,248,.92);backdrop-filter:blur(10px);padding:calc(var(--top) + 12px) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.month button{width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--muted)}
.month button:active{background:var(--soft)}
.month span{min-width:96px;text-align:center;font-weight:600;font-size:14px;text-transform:capitalize}
main{padding:4px 14px calc(var(--bot) + 96px);max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.card h2 a,.link{color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;cursor:pointer}
.hero .big{font-size:38px;font-weight:750;letter-spacing:-.03em;line-height:1.1}
.hero .sub{color:var(--muted);margin-top:4px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar.thin{height:5px;margin-top:6px}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pill{background:var(--soft);border-radius:12px;padding:9px 10px}
.pill small{display:block;color:var(--muted);font-size:12px}
.pill b{font-size:15px}
.inc{color:var(--inc)} .exp{color:var(--exp)} .muted{color:var(--muted)} .warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:650;text-align:right;white-space:nowrap}
.row.tap{cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--muted);vertical-align:1px;margin-left:4px}
.tag.bank{background:#eaf1ff;color:#2f5fd0}
.tag.rev{background:var(--warn-soft);color:var(--warn)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;margin-top:8px;font-size:14px;background:var(--soft)}
.alert:first-of-type{margin-top:0}
.alert.w{background:var(--warn-soft)} .alert.e{background:var(--exp-soft)} .alert.g{background:var(--accent-soft)}
.alert .e1{font-size:17px;line-height:1.2}
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut-wrap svg{flex:none}
.legend{flex:1;min-width:0}
.legend .l{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.legend .l i{width:9px;height:9px;border-radius:3px;flex:none}
.legend .l span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;padding:6px 6px calc(var(--bot) + 6px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);padding:6px 0;font-weight:600}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--text)}
nav .fab{width:54px;height:54px;border-radius:18px;background:var(--text);color:#fff;font-size:30px;line-height:1;display:grid;place-items:center;margin:-22px auto 0;box-shadow:0 6px 18px rgba(20,23,31,.25)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--card);font-size:13px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.chip.on{background:var(--text);color:#fff}
.search{width:100%;border:0;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);outline:none}
.day{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;margin:16px 4px 6px;text-transform:capitalize}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;background:var(--text);color:#fff;font-weight:650}
.btn.sec{background:var(--soft);color:var(--text)}
.btn.ok{background:var(--accent)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn.sm{padding:7px 11px;border-radius:10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:0 0 5px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none}
.in:focus{border-color:var(--text)}
textarea.in{min-height:90px;font-family:ui-monospace,monospace;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .mid{flex:1}
.set-row .s{color:var(--muted);font-size:13px}
.sw{width:46px;height:28px;border-radius:99px;background:#d6dae1;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--accent)} .sw.on::after{left:21px}
.bud{width:96px;text-align:right}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.note ol{padding-left:18px;margin:6px 0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,18,25,.35);z-index:50;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;padding:10px 18px calc(var(--bot) + 18px);transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#dfe2e7;margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{padding:9px;border-radius:10px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.amount-in{width:100%;border:0;outline:none;font-size:42px;font-weight:750;text-align:center;letter-spacing:-.03em;padding:6px 0 2px;background:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:14px;background:var(--soft);font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15;border:2px solid transparent}
.cat b{font-size:21px;font-weight:400}
.cat.on{border-color:var(--text);color:var(--text);background:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(var(--bot) + 92px);transform:translate(-50%,20px);background:var(--text);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:80;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mini{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.ok-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.bad-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--exp);margin-right:6px}
</style>
</head>
<body>
<header>
  <h1 id="title">Resumen</h1>
  <div class="month" id="monthNav">
    <button id="mPrev" aria-label="Mes anterior">‹</button>
    <span id="mLabel" class="num"></span>
    <button id="mNext" aria-label="Mes siguiente">›</button>
  </div>
</header>
<main id="main"></main>
<nav>
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-v="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos</button>
  <button class="fab" id="fab" aria-label="Añadir">+</button>
  <button data-v="fijos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Fijos</button>
  <button data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EUR=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const EUR0=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const money=n=>EUR.format(n||0);
const money0=n=>Math.abs(n)>=1000?EUR0.format(n):EUR.format(n||0);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>iso(new Date());
const ymOf=s=>s.slice(0,7);
const curYM=()=>todayISO().slice(0,7);
const addMonths=(ym,n)=>{const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const daysIn=ym=>{const [y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()};
const monthName=(ym,short)=>{const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("es-ES",short?{month:"short"}:{month:"long",year:"numeric"})};
const dayLabel=s=>{const t=todayISO();if(s===t)return"Hoy";const y=new Date();y.setDate(y.getDate()-1);if(s===iso(y))return"Ayer";const [a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})};
const parseAmt=v=>{if(typeof v==="number")return v;v=String(v||"").trim().replace(/\s|€/g,"");if(/,\d{1,2}$/.test(v))v=v.replace(/\./g,"").replace(",",".");else v=v.replace(/,/g,"");const n=parseFloat(v);return isFinite(n)?Math.round(n*100)/100:0};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9&+ ]+/g," ").replace(/\s+/g," ").trim();
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600)}

/* ============ Datos ============ */
const KEY="miscuentas.v1";
const DEFAULT_CATS=[
 {id:"hipoteca",name:"Hipoteca",icon:"🏠",color:"#4f46e5",type:"exp",budget:0},
 {id:"comunidad",name:"Comunidad",icon:"🏢",color:"#7c3aed",type:"exp",budget:0},
 {id:"suministros",name:"Luz, agua y gas",icon:"💡",color:"#f59e0b",type:"exp",budget:0},
 {id:"internet",name:"Internet y móvil",icon:"📶",color:"#06b6d4",type:"exp",budget:0},
 {id:"super",name:"Súper",icon:"🛒",color:"#10b981",type:"exp",budget:0},
 {id:"casa",name:"Casa y muebles",icon:"🛋️",color:"#a16207",type:"exp",budget:0},
 {id:"transporte",name:"Transporte",icon:"🚗",color:"#3b82f6",type:"exp",budget:0},
 {id:"ocio",name:"Comer fuera y ocio",icon:"🍽️",color:"#ec4899",type:"exp",budget:0},
 {id:"salud",name:"Salud",icon:"💊",color:"#ef4444",type:"exp",budget:0},
 {id:"ropa",name:"Ropa",icon:"👕",color:"#8b5cf6",type:"exp",budget:0},
 {id:"subs",name:"Suscripciones",icon:"📺",color:"#0ea5e9",type:"exp",budget:0},
 {id:"seguros",name:"Seguros e impuestos",icon:"🧾",color:"#64748b",type:"exp",budget:0},
 {id:"otros",name:"Otros",icon:"📦",color:"#94a3b8",type:"exp",budget:0},
 {id:"nomina",name:"Nómina",icon:"💼",color:"#0e9f6e",type:"inc",budget:0},
 {id:"extra",name:"Extras",icon:"✨",color:"#22c55e",type:"inc",budget:0},
 {id:"otrosi",name:"Otros ingresos",icon:"💰",color:"#84cc16",type:"inc",budget:0},
];
const DEFAULT_RULES={
 super:"mercadona carrefour lidl aldi eroski alcampo consum hipercor bonpreu bon preu condis ahorramas caprabo supercor gadis froiz masymas spar coviran dia supermercado hiper",
 ocio:"restaurante bar cafeteria cafe burger mcdonald telepizza dominos glovo just eat uber eats deliveroo starbucks cine cines ticketmaster kfc taberna cerveceria pizzeria vips foster tgb goiko",
 transporte:"repsol cepsa galp shell gasolinera estacion de servicio ballenoil plenoil petroprix renfe metro emt cabify uber bolt freenow parking aparcamiento autopista peaje ryanair vueling blablacar alsa itv taller",
 suministros:"iberdrola endesa naturgy totalenergies holaluz octopus canal de isabel aguas agua agbar aqualia emasesa electricidad gas natural",
 internet:"movistar vodafone orange digi yoigo pepephone masmovil simyo lowi jazztel finetwork o2 telefonica",
 subs:"netflix spotify hbo disney amazon prime prime video youtube apple com icloud google one dazn filmin openai chatgpt anthropic claude audible playstation xbox steam",
 salud:"farmacia sanitas adeslas dkv asisa clinica dentista dental optica fisioterapia hospital",
 ropa:"zara primark pull&bear bershka h&m mango decathlon stradivarius massimo dutti lefties shein zalando nike adidas springfield",
 casa:"ikea leroy merlin bricomart brico depot conforama maisons du monde jysk mediamarkt worten kave home sklum aki ferreteria",
 hipoteca:"hipoteca prestamo hipotecario cuota prestamo amortizacion",
 comunidad:"comunidad de propietarios comunidad prop cdad prop administracion de fincas administrador fincas",
 seguros:"seguro seguros mapfre mutua madrilena linea directa axa allianz generali ocaso ibi ayuntamiento agencia tributaria aeat impuesto tasa basura",
 nomina:"nomina salario haberes",
 otrosi:"bizum recibido transferencia recibida devolucion abono reembolso",
};
const FIXED_TEMPLATES=[
 {name:"Hipoteca",cat:"hipoteca",day:1,match:"hipoteca"},
 {name:"Comunidad",cat:"comunidad",day:5,match:"comunidad"},
 {name:"Luz",cat:"suministros",day:10,match:""},
 {name:"Agua",cat:"suministros",day:15,match:""},
 {name:"Gas",cat:"suministros",day:15,match:""},
 {name:"Internet y móvil",cat:"internet",day:3,match:""},
 {name:"Seguro de hogar",cat:"seguros",day:1,match:"seguro",freq:"y"},
 {name:"IBI",cat:"seguros",day:1,match:"ibi",freq:"y"},
 {name:"Nómina",cat:"nomina",day:28,match:"nomina",type:"inc"},
];
function freshState(){return{v:1,txs:[],cats:DEFAULT_CATS.map(c=>({...c})),fixed:[],rules:[],settings:{startBalance:0,goalName:"Colchón de emergencia",goalTarget:0,monthBudget:0,notif:false},bank:{appId:"",pem:"",redirect:"",aspsp:"",country:"ES",sessionId:"",validUntil:"",accounts:[],lastSync:0,pendingState:""}}}
let S;
function load(){
  try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):freshState()}catch(e){S=freshState()}
  const f=freshState();
  S.settings={...f.settings,...(S.settings||{})};S.bank={...f.bank,...(S.bank||{})};
  S.txs=S.txs||[];S.cats=S.cats||f.cats;S.fixed=S.fixed||[];S.rules=S.rules||[];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushNative()}
const cat=id=>S.cats.find(c=>c.id===id)||{id,name:"Sin categoría",icon:"❔",color:"#94a3b8",type:"exp"};
const catsOf=t=>S.cats.filter(c=>c.type===t);

/* ============ Clasificación automática ============ */
const STOP=new Set("tpv tpvs cajero compra tarjeta tarj pago pagos en con movil apple pay google pay recibo cargo adeudo transferencia transf a de del la el los las sl s l sa s a es www com http https visa mastercard debito credito contactless num ref fecha operacion op bizum enviado concepto".split(" "));
function merchantKey(text){
  const w=norm(text).split(" ").filter(x=>x.length>2&&!STOP.has(x)&&!/^\d+$/.test(x)&&!/\d{3,}/.test(x));
  return w.slice(0,2).join(" ");
}
function classify(text,type){
  const n=" "+norm(text)+" ";
  if(!n.trim())return{cat:type==="inc"?"otrosi":"otros",sure:false};
  for(const r of S.rules){if(r.key&&n.includes(" "+r.key+" ")&&cat(r.cat).type===type)return{cat:r.cat,sure:true}}
  for(const f of S.fixed){if(f.match&&(f.type||"exp")===type&&n.includes(" "+norm(f.match)+" "))return{cat:f.cat,sure:true,fixedId:f.id}}
  for(const [c,words] of Object.entries(DEFAULT_RULES)){
    if(!S.cats.find(x=>x.id===c&&x.type===type))continue;
    const list=words.split(" ");
    // frases de dos palabras primero
    for(let i=0;i<list.length;i++){const two=list[i]+" "+(list[i+1]||"");if(list[i+1]&&n.includes(" "+two+" "))return{cat:c,sure:true}}
    for(const w of list){if(w.length>2&&n.includes(" "+w+" "))return{cat:c,sure:true}}
  }
  return{cat:type==="inc"?"otrosi":"otros",sure:false};
}
function learn(tx,newCat){
  const key=merchantKey(tx.note);
  if(!key||key.length<3)return 0;
  S.rules=S.rules.filter(r=>r.key!==key);S.rules.unshift({key,cat:newCat});
  let n=0;
  for(const t of S.txs){if(t!==tx&&t.type===tx.type&&(t.review||t.cat==="otros"||t.cat==="otrosi")&&(" "+norm(t.note)+" ").includes(" "+key+" ")){t.cat=newCat;t.review=false;n++}}
  return {key,n};
}

/* ============ Cálculos ============ */
const txOfMonth=ym=>S.txs.filter(t=>ymOf(t.date)===ym);
function sums(ym){let inc=0,exp=0;for(const t of txOfMonth(ym)){if(t.type==="inc")inc+=t.amount;else exp+=t.amount}return{inc,exp,bal:inc-exp}}
function byCat(ym){const m={};for(const t of txOfMonth(ym))if(t.type==="exp")m[t.cat]=(m[t.cat]||0)+t.amount;return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function monthBudget(){const b=S.cats.filter(c=>c.type==="exp").reduce((a,c)=>a+(+c.budget||0),0);return +S.settings.monthBudget||b}
function fixedDue(f,ym){if((f.freq||"m")==="m")return true;return +(f.month||1)===+ym.slice(5,7)}
function fixedPaid(f,ym){return S.txs.find(t=>t.fixedId===f.id&&ymOf(t.date)===ym)}
function totalMoney(){
  const accs=S.bank.accounts||[];
  if(accs.length&&accs.some(a=>a.balance!=null)){
    let b=accs.reduce((a,x)=>a+(+x.balance||0),0);
    // gastos anotados a mano todavía no vistos en el banco
    for(const t of S.txs)if(t.src!=="bank"&&!t.bankId&&t.date>=(S.bank.balanceDate||"9999"))b+=t.type==="inc"?t.amount:-t.amount;
    return{v:b,src:"bank"};
  }
  let b=+S.settings.startBalance||0;for(const t of S.txs)b+=t.type==="inc"?t.amount:-t.amount;return{v:b,src:"calc"};
}

/* ============ Inicio ============ */
function donut(data,total){
  const R=52,C=2*Math.PI*R;let off=0;
  const segs=data.map(([id,v])=>{const len=v/total*C;const s=`<circle r="${R}" cx="64" cy="64" fill="none" stroke="${cat(id).color}" stroke-width="18" stroke-dasharray="${Math.max(len-1.5,0.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 64 64)"/>`;off+=len;return s}).join("");
  return `<svg width="128" height="128" viewBox="0 0 128 128"><circle r="${R}" cx="64" cy="64" fill="none" stroke="#f1f3f6" stroke-width="18"/>${segs}<text x="64" y="60" text-anchor="middle" font-size="11" fill="#6b7280">Gastado</text><text x="64" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#14171f">${esc(money0(total))}</text></svg>`;
}
function bars6(){
  const ms=[];for(let i=5;i>=0;i--)ms.push(addMonths(month,-i));
  const d=ms.map(m=>({m,...sums(m)}));const max=Math.max(1,...d.map(x=>Math.max(x.inc,x.exp)));
  const W=320,H=130,bw=14,gap=W/6;
  const g=d.map((x,i)=>{const cx=gap*i+gap/2;const hi=x.inc/max*(H-30),he=x.exp/max*(H-30);
    return `<rect x="${cx-bw-1}" y="${H-18-hi}" width="${bw}" height="${hi}" rx="4" fill="#0e9f6e"/><rect x="${cx+1}" y="${H-18-he}" width="${bw}" height="${he}" rx="4" fill="#e5484d"/><text x="${cx}" y="${H-3}" text-anchor="middle" font-size="11" fill="${x.m===month?"#14171f":"#9aa1ad"}" font-weight="${x.m===month?700:500}">${esc(monthName(x.m,true).replace(".",""))}</text>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}</svg><div class="mini" style="justify-content:center;gap:16px;margin-top:4px"><span><span class="ok-dot"></span>Ingresos</span><span><span class="bad-dot"></span>Gastos</span></div>`;
}
function txRow(t){
  const c=cat(t.cat);
  return `<div class="row tap" data-tx="${t.id}"><div class="ic" style="background:${c.color}1f">${c.icon}</div><div class="mid"><div class="t">${esc(t.note||c.name)}</div><div class="s">${esc(c.name)}${t.src==="bank"?'<span class="tag bank">banco</span>':""}${t.review?'<span class="tag rev">revisar</span>':""}</div></div><div class="amt num ${t.type}">${t.type==="exp"?"−":"+"}${esc(money(t.amount))}</div></div>`;
}
function bindRows(root){root.querySelectorAll("[data-tx]").forEach(r=>r.onclick=()=>{const t=S.txs.find(x=>x.id===r.dataset.tx);if(t)openTx(t)})}
function renderHome(){

    else if(sp>=c.budget*.85)al.push(["w",c.icon,`Casi al límite en <b>${esc(c.name)}</b>: ${money(sp)} de ${money0(c.budget)}`]);}

    if(prevSoFar>0&&s.exp>0){const diff=s.exp-prevSoFar;

  }

  if(!S.fixed.length)al.push(["","🏠",`Configura tus gastos fijos del piso (hipoteca, comunidad…). <span class="link" data-act="fijos">Empezar</span>`]);
  if(S.bank.sessionId&&S.bank.validUntil&&new Date(S.bank.validUntil)-Date.now()<7*864e5)al.push(["e","🔑",`El permiso de tu banco caduca pronto. <span class="link" data-act="ajustes">Renovar</span>`]);

    <div class="sub">${esc(heroSub)}</div>

    <div class="pills">
      <div class="pill"><small>Ingresos</small><b class="num inc">${esc(money0(s.inc))}</b></div>
      <div class="pill"><small>Gastos</small><b class="num exp">${esc(money0(s.exp))}</b></div>
      <div class="pill"><small>Ahorro</small><b class="num">${s.inc?Math.round(s.bal/s.inc*100)+"%":"—"}</b></div>
    </div>
  </div>
  ${al.length?`<div class="card"><h2>Avisos</h2>${al.map(a=>`<div class="alert ${a[0]}"><span class="e1">${a[1]}</span><div>${a[2]}</div></div>`).join("")}</div>`:""}
  <div class="card">
    <h2>Mi dinero <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${tm.src==="bank"?"según tu banco":"calculado"}</span></h2>
    <div style="font-size:28px;font-weight:750;letter-spacing:-.02em" class="num">${esc(money(tm.v))}</div>
    ${S.bank.lastSync?`<div class="note">Última actualización: ${new Date(S.bank.lastSync).toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>`:""}
    ${goal>0?`<div style="margin-top:12px"><div class="mini"><span>🎯 ${esc(S.settings.goalName||"Objetivo")}</span><span class="num">${Math.max(0,Math.min(100,Math.round(tm.v/goal*100)))}% de ${esc(money0(goal))}</span></div><div class="bar thin"><i style="width:${Math.max(0,Math.min(100,tm.v/goal*100))}%"></i></div></div>`:`<div class="note" style="margin-top:6px"><span class="link" data-act="ajustes">Pon un objetivo de ahorro</span></div>`}
  </div>
  <div class="card"><h2>¿En qué se va?</h2>
    ${bc.length?`<div class="donut-wrap">${donut(bc,s.exp)}<div class="legend">${bc.slice(0,6).map(([id,v])=>`<div class="l"><i style="background:${cat(id).color}"></i><span>${esc(cat(id).name)}</span><b class="num">${esc(money0(v))}</b></div>`).join("")}${bc.length>6?`<div class="l muted"><i></i><span>+${bc.length-6} más</span></div>`:""}</div></div>

/* ============ Enable Banking ============ */
const EB="https://api.enablebanking.com";
const b64u=buf=>{const b=buf instanceof ArrayBuffer?new Uint8Array(buf):buf;let s="";for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const b64uStr=s=>b64u(new TextEncoder().encode(s));
function derLen(n){if(n<128)return[n];const a=[];while(n>0){a.unshift(n&255);n>>=8}return[0x80|a.length,...a]}
function pkcs1to8(p1){
  const algo=[0x30,0x0d,0x06,0x09,0x2a,0x86,0x48,0x86,0xf7,0x0d,0x01,0x01,0x01,0x05,0x00];
  const oct=[0x04,...derLen(p1.length),...p1];
  const body=[0x02,0x01,0x00,...algo,...oct];
  return new Uint8Array([0x30,...derLen(body.length),...body]);
}
let keyCache={pem:"",key:null};
async function getKey(pem){
  if(keyCache.pem===pem&&keyCache.key)return keyCache.key;
  const isP1=/BEGIN RSA PRIVATE KEY/.test(pem);
  const b=atob(pem.replace(/-----[^-]+-----/g,"").replace(/\s+/g,""));
  let der=Uint8Array.from(b,c=>c.charCodeAt(0));if(isP1)der=pkcs1to8(der);
  const key=await crypto.subtle.importKey("pkcs8",der,{name:"RSASSA-PKCS1-v1_5",hash:"SHA-256"},false,["sign"]);
  keyCache={pem,key};return key;
}
async function jwt(){
  const B=S.bank;if(!B.appId||!B.pem)throw new Error("Falta el ID de la aplicación o la clave");
  const now=Math.floor(Date.now()/1000);
  const h=b64uStr(JSON.stringify({typ:"JWT",alg:"RS256",kid:B.appId}));
  const p=b64uStr(JSON.stringify({iss:"enablebanking.com",aud:"api.enablebanking.com",iat:now,exp:now+3600}));
  const sig=await crypto.subtle.sign("RSASSA-PKCS1-v1_5",await getKey(B.pem),new TextEncoder().encode(h+"."+p));
  return h+"."+p+"."+b64u(sig);
}
async function ebFetch(path,body){
  const r=await fetch(EB+path,{method:body?"POST":"GET",headers:{"Authorization":"Bearer "+await jwt(),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const m=(d&&(d.message||d.detail||d.error))||("HTTP "+r.status);const err=new Error(typeof m==="string"?m:JSON.stringify(m));err.status=r.status;throw err}
  return d;
}
async function bankAuth(aspsp,maxSec){
  try{
    const days=Math.min(180,maxSec?Math.floor(maxSec/86400):90);
    const state=uid();S.bank.pendingState=state;S.bank.aspsp=aspsp;S.bank.maxValidity=maxSec;save();
    const r=await ebFetch("/auth",{access:{balances:true,transactions:true,valid_until:new Date(Date.now()+days*864e5).toISOString()},aspsp:{name:aspsp,country:"ES"},state,redirect_url:S.bank.redirect||REDIRECT_DEFAULT,psu_type:"personal",language:"es"});
    if(BrowserP)await BrowserP.open({url:r.url});else location.href=r.url;
    renderAjustes();
  }catch(e){toast("No se pudo conectar: "+e.message)}
}
async function handleAuthUrl(url){
  try{
    const u=new URL(url.trim().replace(/^miscuentas:\/\//,"https://x/"));
    const code=u.searchParams.get("code"),err=u.searchParams.get("error");
    if(err){toast("El banco devolvió: "+(u.searchParams.get("error_description")||err));return}
    if(!code){toast("No encuentro el código en esa dirección");return}
    try{BrowserP&&await BrowserP.close()}catch(e){}
    toast("Conectando con tu banco…");
    const r=await ebFetch("/sessions",{code});
    S.bank.sessionId=r.session_id;S.bank.validUntil=r.access&&r.access.valid_until||"";S.bank.pendingState="";
    const old=S.bank.accounts||[];
    S.bank.accounts=(r.accounts||[]).map(a=>{const o=old.find(x=>x.iban&&x.iban===(a.account_id&&a.account_id.iban));return{uid:a.uid,name:a.name||a.product||"Cuenta",iban:a.account_id&&a.account_id.iban||"",balance:null,lastDate:o?o.lastDate:""}});
    save();go("ajustes");toast("¡Banco conectado! Bajando movimientos…");
    await bankSync(true);
  }catch(e){toast("Error al conectar: "+e.message)}
}
let syncing=false;
async function bankSync(manual){
  const B=S.bank;if(!isNative||!B.sessionId||syncing)return;
  if(!manual&&Date.now()-B.lastSync<4*3600e3)return;
  syncing=true;render();
  let added=0,matched=0,newest="";
  try{
    for(const acc of B.accounts){
      // saldo
      try{const bl=await ebFetch(`/accounts/${acc.uid}/balances`);const pref=["CLAV","ITAV","XPCD","ITBD","CLBD","OPAV","VALU","PRCD"];
        const list=bl.balances||[];list.sort((a,b)=>(pref.indexOf(a.balance_type)+99)%99-(pref.indexOf(b.balance_type)+99)%99);
        if(list[0]){acc.balance=parseFloat(list[0].balance_amount.amount);S.bank.balanceDate=todayISO()}}catch(e){if(e.status===401||e.status===403)throw e}
      // movimientos
      const from=acc.lastDate?iso(new Date(new Date(acc.lastDate).getTime()-7*864e5)):iso(new Date(Date.now()-90*864e5));
      let ck="",guard=0;
      do{
        const q=`date_from=${from}`+(ck?`&continuation_key=${encodeURIComponent(ck)}`:"");
        const r=await ebFetch(`/accounts/${acc.uid}/transactions?${q}`);
        for(const t of r.transactions||[]){
          if(t.status&&t.status!=="BOOK")continue;
          const date=t.booking_date||t.value_date||t.transaction_date;if(!date)continue;
          let amount=parseFloat(t.transaction_amount&&t.transaction_amount.amount);if(!isFinite(amount))continue;
          const type=(t.credit_debit_indicator==="DBIT"||amount<0)?"exp":"inc";amount=Math.abs(amount);
          const party=type==="exp"?(t.creditor&&t.creditor.name):(t.debtor&&t.debtor.name);
          const info=(t.remittance_information||[]).join(" ");
          const text=[party,info].filter(Boolean).join(" · ").replace(/\s+/g," ").trim();
          const id="b:"+acc.uid.slice(0,8)+":"+(t.entry_reference||t.transaction_id||(date+"|"+amount+"|"+norm(text).slice(0,40)));
          if(S.txs.some(x=>x.id===id||x.bankId===id))continue;
          if(date>newest)newest=date;
          // ¿lo anoté ya a mano?
          const dd=new Date(date).getTime();
          const manual=S.txs.find(x=>x.src!=="bank"&&!x.bankId&&x.type===type&&Math.abs(x.amount-amount)<0.01&&Math.abs(new Date(x.date).getTime()-dd)<=4*864e5);
          if(manual){manual.bankId=id;matched++;continue}
          const g=classify(text,type);
          const tx={id,type,amount,cat:g.cat,note:prettify(party||info||"Movimiento"),date,src:"bank",acc:acc.uid,ts:dd,review:!g.sure,raw:text.slice(0,200)};
          // fijos
          const fx=g.fixedId?S.fixed.find(f=>f.id===g.fixedId):S.fixed.find(f=>(f.type||"exp")===type&&f.match&&(" "+norm(text)+" ").includes(" "+norm(f.match)+" "));
          if(fx&&!fixedPaid(fx,ymOf(date))){tx.fixedId=fx.id;tx.cat=fx.cat;tx.review=false}
          S.txs.push(tx);added++;
        }
        ck=r.continuation_key||"";
      }while(ck&&++guard<20);
      if(newest&&(!acc.lastDate||newest>acc.lastDate))acc.lastDate=newest;
    }
    B.lastSync=Date.now();save();
    if(manual||added)toast(added?`${added} movimiento${added>1?"s":""} nuevo${added>1?"s":""} del banco${matched?` · ${matched} ya los tenías`:""}`:"Todo al día ✓");
  }catch(e){
    if(e.status===401||e.status===403||/expired|session/i.test(e.message))toast("El permiso del banco ha caducado. Renuévalo en Ajustes.");
    else if(manual)toast("No se pudo actualizar: "+e.message);
  }finally{syncing=false;render()}
}
function prettify(s){s=String(s).replace(/\s+/g," ").trim();if(s===s.toUpperCase())s=s.toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());return s.slice(0,60)}

/* ============ Arranque ============ */
load();
if(!S.bank.redirect)S.bank.redirect=REDIRECT_DEFAULT;
render();
if(isNative){
  takePending();pushNative();
  if(QuickAdd){
    if(!S.settings.notifAsked){S.settings.notifAsked=true;S.settings.notif=true;save()}
    if(S.settings.notif)QuickAdd.setNotification({enabled:true}).then(r=>{if(r&&r.permission===false)toast("Permite las notificaciones para ver los botones de anotar")}).catch(e=>toast("Notificación: "+e.message));
  }
  setTimeout(()=>bankSync(false),800);
  if(AppP){
    AppP.addListener("appStateChange",st=>{if(st.isActive){takePending();if(S.settings.notif&&QuickAdd)QuickAdd.setNotification({enabled:true}).catch(()=>{});pushNative();bankSync(false)}});
    AppP.addListener("appUrlOpen",d=>{if(d&&d.url&&/[?&](code|error)=/.test(d.url))handleAuthUrl(d.url)});
    AppP.getLaunchUrl&&AppP.getLaunchUrl().then(d=>{if(d&&d.url&&/[?&](code|error)=/.test(d.url))handleAuthUrl(d.url)}).catch(()=>{});
  }
  // botón atrás de Android cierra la hoja abierta
  if(AppP)AppP.addListener("backButton",()=>{if(sheetEl)closeSheet();else if(view!=="home")go("home");else AppP.minimizeApp&&AppP.minimizeApp()});
}
</script>
