<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#121417">
<title>Mis Cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#121417; --card:#1b1e23; --card2:#22262d; --line:rgba(255,255,255,.06); --soft:rgba(255,255,255,.05);
  --text:#eef1f4; --muted:#8b93a1; --faint:#5d6470;
  --mint:#3ee6a8; --mint2:#2bc49a; --mint-soft:rgba(62,230,168,.12);
  --exp:#ff6b6b; --exp-soft:rgba(255,107,107,.12); --inc:#3ee6a8; --warn:#ffb648; --warn-soft:rgba(255,182,72,.12);
  --r:22px;
  --top:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --bot:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 60% at 50% -10%,rgba(62,230,168,.10),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--mint)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 70%,rgba(18,20,23,0));padding:calc(var(--top) + 14px) 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.03em}
header small{display:block;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:0}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{width:30px;height:30px;border-radius:50%;font-size:17px;color:var(--muted)}
.month button:active{background:var(--soft)}
.month span{min-width:92px;text-align:center;font-weight:600;font-size:13px;text-transform:capitalize}
main{padding:2px 14px calc(var(--bot) + 104px);max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 12px}
.card h2{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 14px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}
.card h2 a,.link{color:var(--mint);text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(155deg,#1f2b27 0%,#1b1e23 55%,#1b1e23 100%);border-color:rgba(62,230,168,.14);padding:20px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(62,230,168,.18),transparent 70%);pointer-events:none}
.hero.bad{background:linear-gradient(155deg,#2e1f22 0%,#1b1e23 60%);border-color:rgba(255,107,107,.18)}
.hero.bad::after{background:radial-gradient(circle,rgba(255,107,107,.18),transparent 70%)}
.hero-top{display:flex;gap:16px;align-items:center}
.hero .lbl{color:var(--muted);font-size:13px;font-weight:600}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:2px}
.hero .sub{color:var(--muted);margin-top:6px;font-size:14px}
.ring{--p:0;--c:var(--mint);width:84px;height:84px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.07) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#1c2125}
.ring b{position:relative;font-size:17px;font-weight:800;letter-spacing:-.02em}
.ring small{position:relative;display:block;font-size:10px;color:var(--muted);text-align:center;margin-top:-2px}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.pill{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.pill small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.pill b{font-size:15px;font-weight:700}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint2),var(--mint));transition:width .5s}
.bar.thin{height:6px;margin-top:7px}
.inc{color:var(--inc)} .exp{color:var(--exp)} .muted{color:var(--muted)} .warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;text-align:right;white-space:nowrap}
.row.tap{cursor:pointer}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--muted);vertical-align:1px;margin-left:5px}
.tag.bank{background:rgba(96,165,250,.14);color:#93c5fd}
.tag.rev{background:var(--warn-soft);color:var(--warn)}
.tag.auto{background:var(--mint-soft);color:var(--mint)}
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-radius:15px;margin-top:8px;font-size:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.alert:first-of-type{margin-top:0}
.alert.w{background:var(--warn-soft);border-color:rgba(255,182,72,.15)} .alert.e{background:var(--exp-soft);border-color:rgba(255,107,107,.18)} .alert.g{background:var(--mint-soft);border-color:rgba(62,230,168,.15)}
.alert .e1{font-size:17px;line-height:1.25}
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut-wrap svg{flex:none}
.legend{flex:1;min-width:0}
.legend .l{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.legend .l i{width:9px;height:9px;border-radius:3px;flex:none}
.legend .l span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9ced6}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:14px}
.lim{margin-top:13px}.lim:first-of-type{margin-top:0}
.mini{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.mini b{color:var(--text);font-weight:600}
nav{position:fixed;left:12px;right:12px;bottom:calc(var(--bot) + 10px);z-index:20;background:rgba(30,33,39,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:center;padding:6px;max-width:616px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.35)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--faint);padding:6px 0;font-weight:600}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--text)}
nav button.on svg{color:var(--mint)}
nav .fab{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,#4ff0b6,#25b98d);color:#0b1712;font-size:30px;font-weight:500;line-height:1;display:grid;place-items:center;margin:0 auto;box-shadow:0 6px 20px rgba(62,230,168,.35)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--mint);color:#0b1712;border-color:var(--mint)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:12px 14px;margin-bottom:10px;outline:none}
.search::placeholder,.in::placeholder{color:var(--faint)}
.day{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:600;margin:16px 4px 6px;text-transform:capitalize}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 16px;border-radius:15px;background:linear-gradient(145deg,#4ff0b6,#25b98d);color:#0b1712;font-weight:700}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn.sm{padding:7px 11px;border-radius:11px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 6px}
.in{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:13px;padding:12px 13px;outline:none;color:var(--text)}
.in:focus{border-color:rgba(62,230,168,.55)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8b93a1 50%),linear-gradient(135deg,#8b93a1 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input[type=date].in{color-scheme:dark}
textarea.in{min-height:90px;font-family:ui-monospace,monospace;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .mid{flex:1;min-width:0}
.set-row .s{color:var(--muted);font-size:13px}
.sw{width:48px;height:28px;border-radius:99px;background:#3a3f48;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--mint)} .sw.on::after{left:23px}
.bud{width:104px;text-align:right}
.note{font-size:13px;color:var(--muted);line-height:1.55}
.note ol{padding-left:18px;margin:6px 0}
.note b{color:var(--text)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#1d2026;border-top:1px solid var(--line);border-radius:26px 26px 0 0;max-height:92vh;overflow-y:auto;padding:10px 18px calc(var(--bot) + 18px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#3a3f48;margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:13px;padding:3px;margin-bottom:14px}
.seg button{padding:9px;border-radius:11px;font-weight:650;color:var(--muted)}
.seg button.on{background:#323741;color:var(--text)}
.amount-in{width:100%;border:0;outline:none;font-size:46px;font-weight:800;text-align:center;letter-spacing:-.04em;padding:6px 0 2px;background:none}
.amount-in::placeholder{color:#3a3f48}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:15px;background:var(--card2);font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15;border:1.5px solid transparent}
.cat b{font-size:21px;font-weight:400}
.cat.on{border-color:var(--mint);color:var(--text);background:var(--mint-soft)}
.toast{position:fixed;left:50%;bottom:calc(var(--bot) + 100px);transform:translate(-50%,20px);background:#eef1f4;color:#121417;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:80;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
/* asistente */
.wiz{position:fixed;inset:0;z-index:90;background:radial-gradient(120% 60% at 50% -10%,rgba(62,230,168,.14),transparent 60%),var(--bg);overflow-y:auto;padding:calc(var(--top) + 18px) 20px calc(var(--bot) + 24px);display:flex;flex-direction:column}
.wiz .in-wrap{max-width:520px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column}
.wiz .steps{display:flex;gap:6px;margin-bottom:26px}
.wiz .steps i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.08)}
.wiz .steps i.on{background:var(--mint)}
.wiz .emoji{font-size:44px;margin-bottom:6px}
.wiz h2{font-size:28px;letter-spacing:-.03em;margin:0 0 8px;font-weight:800;line-height:1.15}
.wiz p.lead{color:var(--muted);margin:0 0 22px;font-size:15px}
.wiz .big-in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:30px;font-weight:800;letter-spacing:-.03em;outline:none;color:var(--text)}
.wiz .big-in:focus{border-color:rgba(62,230,168,.55)}
.wiz .foot{display:flex;gap:10px;margin-top:auto;padding-top:22px}
.wiz .foot .btn{flex:1}
.fxrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.fxrow:first-child{border-top:0}
.fxrow .nm{flex:1;min-width:0;font-weight:600}
.fxrow .nm small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.calc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
.calc .mini{padding:4px 0}
.calc .tot{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-size:15px}
</style>
</head>
<body>
<header>
  <h1 id="title">Resumen</h1>
  <div class="month" id="monthNav">
    <button id="mPrev" aria-label="Mes anterior">‹</button>
    <span id="mLabel" class="num"></span>
    <button id="mNext" aria-label="Mes siguiente">›</button>
  </div>
</header>
<main id="main"></main>
<nav>
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-v="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos</button>
  <button class="fab" id="fab" aria-label="Añadir gasto">+</button>
  <button data-v="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Objetivos</button>
  <button data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Ajustes</button>
</nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EUR=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const EUR0=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const money=n=>EUR.format(n||0);
const money0=n=>Math.abs(n)>=100?EUR0.format(Math.round(n||0)):EUR.format(n||0);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>iso(new Date());
const ymOf=s=>s.slice(0,7);
const curYM=()=>todayISO().slice(0,7);
const addMonths=(ym,n)=>{const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const daysIn=ym=>{const [y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()};
const daysLeft=()=>daysIn(curYM())-new Date().getDate()+1;
const monthName=(ym,short)=>{const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("es-ES",short?{month:"short"}:{month:"long",year:"numeric"})};
const dayLabel=s=>{const t=todayISO();if(s===t)return"Hoy";const y=new Date();y.setDate(y.getDate()-1);if(s===iso(y))return"Ayer";const [a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})};
const parseAmt=v=>{if(typeof v==="number")return v;v=String(v||"").trim().replace(/\s|€/g,"");if(/,\d{1,2}$/.test(v))v=v.replace(/\./g,"").replace(",",".");else if(/\.\d{3}$/.test(v))v=v.replace(/\./g,"");else v=v.replace(/,/g,"");const n=parseFloat(v);return isFinite(n)?Math.round(n*100)/100:0};
const amtStr=n=>+n?String(n).replace(".",","):"";
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9&+ ]+/g," ").replace(/\s+/g," ").trim();
/* ============ Errores: que nunca paren la app y se puedan ver ============ */
const ERRS=[];
function logErr(where,e){const m=`${where}: ${e&&e.message||e}`;ERRS.push(m);try{const l=JSON.parse(localStorage.getItem("miscuentas.errs")||"[]");l.unshift(new Date().toLocaleString("es-ES")+" · "+m);localStorage.setItem("miscuentas.errs",JSON.stringify(l.slice(0,15)))}catch(_){}console.error(where,e)}
function safe(where,fn,fallback){try{return fn()}catch(e){logErr(where,e);return fallback}}
window.addEventListener("error",e=>logErr("error",e.error||e.message));
window.addEventListener("unhandledrejection",e=>logErr("promesa",e.reason));
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2800)}

/* ============ Datos ============ */
const KEY="miscuentas.v1";
const DEFAULT_CATS=[
 {id:"hipoteca",name:"Hipoteca",icon:"🏠",color:"#818cf8",type:"exp",budget:0},
 {id:"comunidad",name:"Comunidad",icon:"🏢",color:"#a78bfa",type:"exp",budget:0},
 {id:"suministros",name:"Luz, agua y gas",icon:"💡",color:"#fbbf24",type:"exp",budget:0},
 {id:"internet",name:"Internet y móvil",icon:"📶",color:"#22d3ee",type:"exp",budget:0},
 {id:"super",name:"Súper",icon:"🛒",color:"#3ee6a8",type:"exp",budget:0},
 {id:"casa",name:"Casa y muebles",icon:"🛋️",color:"#d6a76c",type:"exp",budget:0},
 {id:"transporte",name:"Transporte",icon:"🚗",color:"#60a5fa",type:"exp",budget:0},
 {id:"ocio",name:"Comer fuera y ocio",icon:"🍽️",color:"#f472b6",type:"exp",budget:0},
 {id:"salud",name:"Salud y deporte",icon:"🧠",color:"#f87171",type:"exp",budget:0},
 {id:"tools",name:"Herramientas e IA",icon:"💻",color:"#2dd4bf",type:"exp",budget:0},
 {id:"ropa",name:"Ropa",icon:"👕",color:"#c084fc",type:"exp",budget:0},
 {id:"subs",name:"Suscripciones",icon:"📺",color:"#38bdf8",type:"exp",budget:0},
 {id:"seguros",name:"Seguros e impuestos",icon:"🧾",color:"#94a3b8",type:"exp",budget:0},
 {id:"coche",name:"Coche",icon:"🔧",color:"#93c5fd",type:"exp",budget:0},

/** Hucha de cada objetivo: cada mes se reparte lo ahorrado según lo que aportas a cada uno. */
function huchas(){
  const cur=curYM(),gs=S.goals||[],res={};let extra=0;
  for(const g of gs)res[g.id]={g,saved:+g.initial||0,used:0,month:0};
  if(!gs.length)return{list:[],extra:0};
  const first=gs.map(g=>(g.start||cur+"-01").slice(0,7)).sort()[0];
  const split=(m,v,proj)=>{
    const act=gs.filter(g=>(g.start||"").slice(0,7)<=m&&(!g.end||g.end.slice(0,7)>=m)&&(+g.monthly||0)>0);
    const tot=act.reduce((a,g)=>a+(+g.monthly),0);if(!tot){if(!proj)extra+=v;return}
    for(const g of act){const part=v>=tot?+g.monthly:v*(+g.monthly)/tot;if(proj)res[g.id].month+=part;else res[g.id].saved+=part}
    if(v>tot&&!proj)extra+=v-tot;
  };
  for(let m=first;m<cur;m=addMonths(m,1)){const x=sums(m);split(m,x.inc-x.exp,false)}
  const P=plan(cur);split(cur,P.has?P.income-P.exp-P.fixPending:sums(cur).inc-sums(cur).exp,true);
  for(const t of S.txs){if(t.type==="exp"&&t.goal&&res[t.goal])res[t.goal].used+=t.amount;const gr=goalRefund(t);if(gr&&res[gr])res[gr].used-=t.amount}
  const list=gs.map(g=>{const r=res[g.id];const avail=(g.archived&&g.finalSaved!=null?g.finalSaved:r.saved)-r.used;return{...r,avail,withMonth:avail+Math.max(0,r.month)}});
  return{list,extra};
}

function merchantKey(text){const w=norm(text).split(" ").filter(x=>x.length>2&&!STOP.has(x)&&!/^\d+$/.test(x)&&!/\d{3,}/.test(x));return w.slice(0,2).join(" ")}
function classify(text,type){
  const n=" "+norm(text)+" ";
  if(!n.trim())return{cat:type==="inc"?"otrosi":"otros",sure:false};
  for(const r of S.rules){if(r.key&&n.includes(" "+r.key+" ")&&cat(r.cat).type===type)return{cat:r.cat,sure:true}}
  for(const f of S.fixed){if(f.match&&(f.type||"exp")===type&&n.includes(" "+norm(f.match)+" "))return{cat:f.cat,sure:true,fixedId:f.id}}
  for(const [c,words] of Object.entries(DEFAULT_RULES)){
    if(!S.cats.find(x=>x.id===c&&x.type===type))continue;
    const list=words.split(" ");
    for(let i=0;i<list.length-1;i++){if(n.includes(" "+list[i]+" "+list[i+1]+" "))return{cat:c,sure:true}}
    for(const w of list){if(w.length>2&&n.includes(" "+w+" "))return{cat:c,sure:true}}
  }
  if(type==="inc"){const g=classify(text,"exp");if(g.sure&&!cat(g.cat).saving)return{cat:g.cat,sure:true,refund:true}}
  return{cat:type==="inc"?"otrosi":"otros",sure:false};
}
function learn(tx,newCat){
  const key=merchantKey(tx.note);if(!key||key.length<3)return null;
  S.rules=S.rules.filter(r=>r.key!==key);S.rules.unshift({key,cat:newCat});
  let n=0;for(const t of S.txs){if(t!==tx&&t.type===tx.type&&(t.review||t.cat==="otros"||t.cat==="otrosi")&&(" "+norm(t.note)+" ").includes(" "+key+" ")){t.cat=newCat;t.review=false;n++}}
  return{key,n};
}

function sums(ym){let inc=0,gross=0,ref=0,sav=0,gs=0;for(const t of txOfMonth(ym)){if(goalRefund(t)){gs-=t.amount;continue}if(isRefund(t))ref+=t.amount;else if(t.type==="inc")inc+=t.amount;else if(t.goal)gs+=t.amount;else if(isSaving(t))sav+=t.amount;else gross+=t.amount}const exp=gross-ref;return{inc,exp,gross,ref,sav,gs,bal:inc-exp}}
function byCat(ym,varOnly){const m={};let ref=0;for(const t of txOfMonth(ym)){if(varOnly&&t.fixedId)continue;if(goalRefund(t))continue;if(isRefund(t)&&cat(t.cat).type==="exp")m[t.cat]=(m[t.cat]||0)-t.amount;else if(isRefund(t))ref+=t.amount;else if(t.type==="exp"&&!isSaving(t)&&!t.goal)m[t.cat]=(m[t.cat]||0)+t.amount}
  // las devoluciones de amigos se descuentan de «comer fuera y ocio» (casi siempre son cenas a medias)
  if(ref&&m.ocio){const d=Math.min(m.ocio,ref);m.ocio-=d;ref-=d;if(m.ocio<=0.005)delete m.ocio}
  return Object.entries(m).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1])}
/** Gasto del día a día en una categoría (sin los fijos, que ya van aparte del límite). */
const spentCat=(ym,id)=>{const e=byCat(ym,true).find(x=>x[0]===id);return e?e[1]:0};
function fixedDue(f,ym){return (f.freq||"m")==="m"||+(f.month||1)===+ym.slice(5,7)}
const fixedLinked=(f,ym)=>S.txs.filter(t=>t.fixedId===f.id&&ymOf(t.date)===ym);
const fixedSum=(f,ym)=>fixedLinked(f,ym).reduce((a,t)=>a+t.amount,0);
/** Pagado si lo cargado este mes llega al importe (permite pagos en varias veces, como el psicólogo). */
function fixedPaid(f,ym){const l=fixedLinked(f,ym);if(!l.length)return null;const sum=l.reduce((a,t)=>a+t.amount,0);return(!(+f.amount)||sum>=(+f.amount)*0.9)?{amount:sum,tx:l[0]}:null}
/** El plan del mes: lo que entra, lo fijo, el ahorro y lo que queda para gastar. */
function plan(ym){
  const s=sums(ym),goal=+S.settings.saveGoal||0;
  let incPending=0,fixPending=0,fixTotal=0;
  for(const f of S.fixed){if(!fixedDue(f,ym))continue;const a=+f.amount||0;const done=fixedSum(f,ym);
    if(cat(f.cat).saving)continue;                         // los traspasos a ahorro no restan
    if((f.type||"exp")==="inc"){incPending+=Math.max(0,a-done)}
    else{fixTotal+=Math.max(a,done);fixPending+=Math.max(0,a-done)}}
  const income=s.inc+incPending;                  // lo que entra este mes (cobrado + por cobrar)
  const spendable=income-fixTotal-goal;           // presupuesto para el día a día
  const canSpend=income-s.exp-fixPending-goal;    // lo que puedes gastar aún sin tocar el ahorro
  const savedProj=Math.min(goal,goal+canSpend);   // ahorro que conservas si no gastas más
  const has=income>0;
  return{...s,income,incPending,fixPending,fixTotal,goal,spendable,canSpend,savedProj,has,variable:s.exp-(fixTotal-fixPending)};
}

/** Media mensual de tu día a día por categoría (sin fijos, sin ahorro, sin gastos extraordinarios de +300 €). */
function catStats(){
  const ms=histMonths(),sum={},gross={},cnt={},merch={};
  for(const m of ms)for(const t of txOfMonth(m)){
    if(t.fixedId||t.goal||t.amount>300)continue;
    if(t.type==="exp"&&!isSaving(t)){sum[t.cat]=(sum[t.cat]||0)+t.amount;gross[t.cat]=(gross[t.cat]||0)+t.amount;cnt[t.cat]=(cnt[t.cat]||0)+1;
      const k=prettify(t.note||"");if(k){const mk=t.cat+"|"+k;merch[mk]=(merch[mk]||0)+t.amount}}
    else if(isRefund(t)){const c=cat(t.cat).type==="exp"?t.cat:"ocio";sum[c]=(sum[c]||0)-t.amount}
  }
  const avg={};
  if(ms.length){for(const k in sum){const v=sum[k]/ms.length;if(v>=5&&!cat(k).saving&&cat(k).type==="exp")avg[k]=v}}
  else Object.assign(avg,LIMIT_SUGGEST);
  for(const k of ["hipoteca","comunidad"])delete avg[k];
  const ticket={};for(const k in gross)ticket[k]=gross[k]/cnt[k];
  return{avg,ticket,merch,months:ms.length};
}
/** Lo que puedes gastar al mes en el día a día según tu plan (sin depender de lo ya gastado). */
function budgetBase(){
  let inc=0,fix=0;for(const f of S.fixed){if((f.freq||"m")!=="m")continue;const a=+f.amount||0;if(f.type==="inc")inc+=a;else if(!cat(f.cat).saving)fix+=a}
  const yearly=S.fixed.filter(f=>f.freq==="y"&&f.type!=="inc").reduce((a,f)=>a+(+f.amount||0),0)/12;
  return inc-fix-yearly-(+S.settings.saveGoal||0);
}
/** Reparte el presupuesto: recorta poco en lo básico y más en lo prescindible. locks = límites que has fijado tú. */
function suggestLimits(budget,locks,avgIn){
  const avg={...(avgIn||catStats().avg)};locks=locks||{};
  const out={};let free=budget;
  for(const k in locks){out[k]=+locks[k]||0;free-=out[k];delete avg[k]}
  const keys=Object.keys(avg);const A=keys.reduce((a,k)=>a+avg[k],0);
  if(!keys.length)return{lims:out,spare:free};
  if(free>=A){for(const k of keys)out[k]=round5(avg[k]);return{lims:out,spare:free-keys.reduce((a,k)=>a+out[k],0)}}
  let need=A-Math.max(0,free);const cut={};keys.forEach(k=>cut[k]=0);
  const maxCut=k=>avg[k]*(ESSENTIAL.has(k)?0.35:0.85);
  for(let it=0;it<8&&need>0.5;it++){
    const open=keys.filter(k=>cut[k]<maxCut(k)-0.01);if(!open.length)break;
    const W=open.reduce((a,k)=>a+avg[k]*(ESSENTIAL.has(k)?0.3:1),0);
    let used=0;for(const k of open){const want=need*avg[k]*(ESSENTIAL.has(k)?0.3:1)/W;const c=Math.min(want,maxCut(k)-cut[k]);cut[k]+=c;used+=c}
    need-=used;
  }
  // si aún no llega, recorta lo que falte por igual
  if(need>0.5){for(const k of keys){const c=Math.min(avg[k]-cut[k],need/keys.length);cut[k]+=c}}
  for(const k of keys)out[k]=Math.max(0,Math.floor((avg[k]-cut[k])/5)*5);
  // lo que sobra del redondeo, de 5 en 5, a las categorías que más se han recortado
  let spare=free-keys.reduce((a,k)=>a+out[k],0);
  const byLoss=keys.slice().sort((a,b)=>(avg[b]-cut[b]-out[b])-(avg[a]-cut[a]-out[a]));
  for(let i=0;spare>=5&&i<40;i++){const k=byLoss[i%byLoss.length];out[k]+=5;spare-=5}
  return{lims:out,spare};
}
/** Enlaza con sus fijos los movimientos ya existentes (por el «texto en el banco»), y quita los «auto» que sobran. */
function relinkFixed(){
  const touched=new Set();
  for(const t of S.txs){
    if(t.fixedId||t.src==="auto"||t.src==="manual"||t.src==="quick")continue;
    const txt=" "+norm(t.raw||t.note)+" ";
    const f=S.fixed.find(f=>(f.type||"exp")===t.type&&f.match&&txt.includes(" "+norm(f.match)+" "));
    if(f){t.fixedId=f.id;t.cat=f.cat;t.review=false;touched.add(f.id+"|"+ymOf(t.date))}
  }
  for(const t of S.txs)if(t.fixedId&&t.src!=="auto")touched.add(t.fixedId+"|"+ymOf(t.date));
  S.txs=S.txs.filter(t=>!(t.src==="auto"&&!t.ext&&t.created===0&&touched.has(t.fixedId+"|"+ymOf(t.date))));
}

function tips(){

    const a=st.avg[c.id]||0,lim=+c.budget||0;if(!lim||a<=lim*1.08||c.id==="tools"||c.id==="subs")continue;
    const diff=a-lim,tk=st.ticket[c.id]||0,n=tk?Math.max(1,Math.round(diff/tk)):0,nn=NOUN[c.id]||["gasto","gastos"];
    const top=Object.entries(st.merch).filter(([k])=>k.startsWith(c.id+"|")).sort((x,y)=>y[1]-x[1]).slice(0,3).map(([k,v])=>`${esc(k.split("|")[1])} (${money0(v/months)}/mes)`);
    out.push({save:diff,icon:c.icon,title:`${c.name}: de ${money0(a)} a ${money0(lim)} al mes`,
      text:`${n?`${n===1?"Es <b>1 "+nn[0]:"Son unas <b>"+n+" "+nn[1]} menos</b> al mes (de media te gastas ${money0(tk)} cada vez). `:""}${top.length?`Donde más se va: ${top.join(", ")}.`:""}${c.id==="ocio"?" Truco: pon un tope por salida y paga con Bizum solo tu parte, así no adelantas dinero.":""}${c.id==="transporte"?" Llenar el depósito en gasolineras low cost (Plenoil, Ballenoil, Petroprix) suele ahorrar 10-15 céntimos por litro.":""}`});
  }
  // suscripciones y herramientas que se repiten
  const subs=Object.entries(st.merch).filter(([k])=>/^(tools|subs)\|/.test(k)).map(([k,v])=>[k.split("|")[1],v/months]).filter(x=>x[1]>=3).sort((a,b)=>b[1]-a[1]);
  const subsFixed=S.fixed.filter(f=>["tools","subs"].includes(f.cat)&&f.type!=="inc");
  const subTot=subs.reduce((a,x)=>a+x[1],0)+subsFixed.reduce((a,f)=>a+(+f.amount||0),0);
  if(subTot>=20)out.push({save:subTot*0.3,icon:"🔁",title:`Suscripciones y herramientas: ${money0(subTot)} al mes`,
    text:`${[...subsFixed.map(f=>`${esc(f.name)} (${money0(f.amount)})`),...subs.slice(0,5).map(x=>`${esc(x[0])} (${money0(x[1])})`)].join(", ")}. Revisa cuáles usas de verdad: cancelar las que no, o pasarlas a plan anual, suele ahorrar un 20-30 %.`});
  // fines de semana
  let wk=0,all=0;for(const m of histMonths())for(const t of txOfMonth(m)){if(t.type!=="exp"||t.cat!=="ocio"||t.fixedId)continue;all+=t.amount;const g=new Date(t.date).getDay();if(g===0||g===5||g===6)wk+=t.amount}
  if(all>100&&wk/all>0.6)out.push({save:0,icon:"📅",title:`El ${Math.round(wk/all*100)} % de lo que gastas en salir es de viernes a domingo`,text:`Decide antes del finde cuánto vas a gastar (por ejemplo ${money0(Math.max(20,(+cat("ocio").budget||100)/4))} por finde) y apúntalo nada más pagar desde la notificación: verás el contador bajar.`});
  // ritmo del mes actual
  for(const c of catsOf("exp")){const lim=+c.budget||0;if(!lim)continue;const sp=spentCat(ym,c.id);const pace=sp/lim,time=day/dim;
    if(sp<lim&&pace>time+0.25&&pace>0.5)out.push({save:0,icon:"⏱️",title:`Vas rápido en ${c.name}`,text:`Llevas el ${Math.round(pace*100)} % del límite y solo ha pasado el ${Math.round(time*100)} % del mes. Te quedan ${money0(lim-sp)} hasta fin de mes (${money0((lim-sp)/(dim-day+1))}/día).`,now:true})}
  // gastos grandes recientes
  const big=S.txs.filter(t=>t.type==="exp"&&!t.fixedId&&!t.goal&&!isSaving(t)&&t.amount>=100&&Date.now()-new Date(t.date).getTime()<45*864e5).sort((a,b)=>b.amount-a.amount).slice(0,3);
  if(big.length)out.push({save:0,icon:"💸",title:"Gastos grandes del último mes y medio",text:big.map(t=>`${esc(t.note||cat(t.cat).name)} ${money0(t.amount)} (${new Date(t.date).toLocaleDateString("es-ES",{day:"numeric",month:"short"})})`).join(" · ")+". Antes de un gasto de más de 100 €, espera 48 horas: muchas veces se te pasan las ganas."});
  out.sort((a,b)=>(b.now?1:0)-(a.now?1:0)||b.save-a.save);
  return out;
}

/** Editor de límites: reparte solo y reajusta el resto cuando tocas uno. */
function limitsEditor(el,budget,state,onChange,stats){
  const st=stats||catStats();state.locks=state.locks||{};
  const draw=()=>{
    const {lims,spare}=suggestLimits(budget,state.locks,st.avg);state.lims=lims;
    const keys=Object.keys(lims).sort((a,b)=>(st.avg[b]||0)-(st.avg[a]||0));

    el.innerHTML=`<div class="calc" style="margin:0 0 12px"><div class="mini"><span>Para el día a día</span><b class="num">${money0(budget)}</b></div><div class="mini"><span>Repartido</span><b class="num">${money0(tot)}</b></div>
      <div class="mini tot"><span><b>${spare>=0?"Sin repartir":"Te pasas"}</b></span><b class="num ${spare<0?"exp":"inc"}">${money0(Math.abs(spare))}</b></div></div>
      ${budget<=0?`<div class="alert e"><span class="e1">⚠️</span><div>Con este ahorro no te queda nada para el día a día. Baja el objetivo de ahorro.</div></div>`:""}
      <div class="card" style="padding:6px 16px;margin:0">${keys.map(k=>{const a=st.avg[k]||0,v=lims[k]||0,lk=k in state.locks;return `<div class="fxrow"><div class="nm">${cat(k).icon} ${esc(cat(k).name)}<small>${a?`ahora ${money0(a)}`:""}${a&&v<a-2?` · <span class="exp">−${money0(a-v)}</span>`:""}${lk?' · <span class="inc">fijado por ti</span>':""}</small></div><input class="in bud num" data-l="${k}" inputmode="decimal" value="${amtStr(v)}"></div>`}).join("")}</div>
      <div class="note" style="margin-top:10px">Recorto poco en lo básico (súper, gasolina, salud) y más en lo prescindible. Si cambias una cifra, la dejo fija y reajusto el resto.${Object.keys(state.locks).length?` <span class="link" data-reset>Volver a repartir todo</span>`:""}</div>`;
    el.querySelectorAll("[data-l]").forEach(i=>i.onchange=()=>{state.locks[i.dataset.l]=parseAmt(i.value);draw();onChange&&onChange()});
    const r=el.querySelector("[data-reset]");if(r)r.onclick=()=>{state.locks={};draw();onChange&&onChange()};
  };
  draw();
}

function totalMoney(){
  const accs=S.bank.accounts||[];
  if(S.bank.sessionId&&accs.some(a=>a.balance!=null)){
    let b=accs.reduce((a,x)=>a+(+x.balance||0),0);
    for(const t of S.txs)if(t.src!=="bank"&&!t.ext&&!t.bankId&&t.date>=(S.bank.balanceDate||"9999"))b+=t.type==="inc"?t.amount:-t.amount;
    return{v:b,src:"bank"};
  }
  const B=S.settings.balance;if(!B)return null;
  let b=+B.amount;
  for(const t of S.txs){if(t.ext)continue;const when=t.created!==undefined?t.created:(t.ts||0);if(when>B.ts&&t.date>=B.date)b+=t.type==="inc"?t.amount:-t.amount}
  return{v:b,src:"manual",since:B.ts};
}
/** Anota solos los fijos cuyo día ya ha llegado (si no hay banco conectado). */
function autoFixed(){
  const ym=curYM(),d=new Date().getDate();let n=0;
  for(const f of S.fixed){
    if(!f.auto||!(+f.amount)||!fixedDue(f,ym)||fixedPaid(f,ym))continue;
    if(S.bank.sessionId&&!f.ext)continue;                                            // con banco conectado, llega el cargo real
    const day=Math.min(+f.day||1,daysIn(ym));if(day>d)continue;
    if(!f.ext&&S.settings.csvDate&&`${ym}-${pad(day)}`<=S.settings.csvDate)continue;  // ya cubierto por el extracto importado
    if(f.since&&`${ym}-${pad(day)}`<f.since)continue;
    const left=Math.round(((+f.amount)-fixedSum(f,ym))*100)/100;if(left<=0)continue;
    S.txs.push({id:uid(),type:f.type||"exp",amount:left,cat:f.cat,note:f.name,date:`${ym}-${pad(day)}`,fixedId:f.id,src:"auto",ts:Date.now(),created:Date.now(),ext:!!f.ext||undefined});n++;
  }
  if(n)save();return n;
}

function donut(data,total){
  const R=50,C=2*Math.PI*R;let off=0;
  const segs=data.map(([id,v])=>{const len=v/total*C;const s=`<circle r="${R}" cx="64" cy="64" fill="none" stroke="${cat(id).color}" stroke-width="14" stroke-linecap="butt" stroke-dasharray="${Math.max(len-2,0.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 64 64)"/>`;off+=len;return s}).join("");
  return `<svg width="128" height="128" viewBox="0 0 128 128"><circle r="${R}" cx="64" cy="64" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="14"/>${segs}<text x="64" y="59" text-anchor="middle" font-size="11" fill="#8b93a1" font-family="Inter,sans-serif">Gastado</text><text x="64" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#eef1f4" font-family="Inter,sans-serif">${esc(money0(total))}</text></svg>`;
}

/** Fijos que este mes (o el pasado) han llegado bastante más caros de lo habitual. */
function fixedRises(){
  const out=[],seen=new Set(S.settings.riseSeen||[]);
  for(const ym of [curYM(),addMonths(curYM(),-1)])for(const f of S.fixed){
    if((f.type||"exp")!=="exp"||!(+f.amount)||cat(f.cat).saving||seen.has(f.id+"|"+ym))continue;
    const real=fixedLinked(f,ym).filter(t=>t.src==="bank"||t.src==="import");if(!real.length)continue;
    const now=real.reduce((a,t)=>a+t.amount,0);
    if(now>f.amount*1.15&&now-f.amount>=5&&!out.some(o=>o.f===f))out.push({f,ym,now:Math.round(now*100)/100});
  }
  return out;
}
/** Tarjeta de cierre del mes anterior (los primeros días del mes). */
function closingCard(){
  const prev=addMonths(curYM(),-1);
  if(new Date().getDate()>7||S.settings.closedSeen===prev||!txOfMonth(prev).length)return"";
  const x=sums(prev),goal=+S.settings.saveGoal||0,saved=x.inc-x.exp;
  const lims=catsOf("exp").filter(c=>+c.budget>0).map(c=>({c,v:spentCat(prev,c.id)}));
  const ok=lims.filter(l=>l.v<=l.c.budget),over=lims.filter(l=>l.v>l.c.budget).sort((a,b)=>(b.v-b.c.budget)-(a.v-a.c.budget));
  const win=goal?saved>=goal:saved>0;
  return `<div class="card" style="border-color:${win?"rgba(62,230,168,.3)":"rgba(255,182,72,.3)"}"><h2>📅 Así cerraste ${esc(monthName(prev).split(" ")[0])}</h2>
    <div style="font-size:22px;font-weight:800;letter-spacing:-.02em">${saved<0?`Gastaste ${esc(money0(-saved))} más de lo que entró`:`${win?"🎉 ":""}Ahorraste ${esc(money0(saved))}`}${goal&&saved>=0?` <span class="muted" style="font-size:15px;font-weight:600">de ${esc(money0(goal))}</span>`:""}</div>
    ${lims.length?`<div class="note" style="margin-top:6px">Cumpliste ${ok.length} de ${lims.length} límites.${over.length?` Donde más te pasaste: <b>${esc(over[0].c.name)}</b> (+${esc(money0(over[0].v-over[0].c.budget))}).`:" ¡Todos! 👏"}</div>`:""}

let sheetEl,scrimEl;
function openSheet(html,onMount){
  closeSheet(true);
  scrimEl=document.createElement("div");scrimEl.className="scrim";scrimEl.onclick=()=>closeSheet();
  sheetEl=document.createElement("div");sheetEl.className="sheet";sheetEl.innerHTML=`<div class="grab"></div>`+html;
  document.body.append(scrimEl,sheetEl);
  requestAnimationFrame(()=>{scrimEl.classList.add("show");sheetEl.classList.add("show")});
  onMount&&onMount(sheetEl);
}
function closeSheet(now){
  const s=sheetEl,c=scrimEl;sheetEl=scrimEl=null;if(!s)return;
  if(now){s.remove();c.remove();return}
  s.classList.remove("show");c.classList.remove("show");setTimeout(()=>{s.remove();c.remove()},260);
}
function confirmBox(text,okLabel){return new Promise(res=>{openSheet(`<h3>${esc(text)}</h3><div class="grid2"><button class="btn sec" id="cNo">Cancelar</button><button class="btn danger" id="cYes">${esc(okLabel||"Aceptar")}</button></div>`,el=>{el.querySelector("#cNo").onclick=()=>{closeSheet();res(false)};el.querySelector("#cYes").onclick=()=>{closeSheet();res(true)}})})}

<style>body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:#f1f3f6;margin:0;padding:18px;color:#14171f}h1{text-align:center;font-size:22px;margin:4px 0}.sub{text-align:center;color:#667;margin:0 0 20px;font-size:14px}.t{background:#fff;border-radius:14px;margin:0 auto 16px;max-width:720px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08)}.h{padding:13px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid #eee}.h span{color:#889;font-size:13px;white-space:nowrap}img{width:100%;display:block}@media print{.t{break-inside:avoid}}</style></head>

/* ============ Fotos de tickets (se guardan en el móvil, aparte) ============ */
const PHOTODB="miscuentas-fotos";
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(PHOTODB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("fotos"))r.result.createObjectStore("fotos")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function photoPut(id,data){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("fotos","readwrite");tx.objectStore("fotos").put(data,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function photoGet(id){try{const db=await idb();return await new Promise(res=>{const rq=db.transaction("fotos","readonly").objectStore("fotos").get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null)})}catch(e){return null}}
async function photoDel(id){try{const db=await idb();await new Promise(res=>{const tx=db.transaction("fotos","readwrite");tx.objectStore("fotos").delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res()})}catch(e){}}
async function photoCount(){try{const db=await idb();return await new Promise(res=>{const rq=db.transaction("fotos","readonly").objectStore("fotos").count();rq.onsuccess=()=>res(rq.result||0);rq.onerror=()=>res(0)})}catch(e){return 0}}
function compressImg(file,max=1400,q=0.72){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);try{res(cv.toDataURL("image/jpeg",q))}catch(e){rej(e)}};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("No se pudo leer la imagen"))};img.src=url})}
function viewPhoto(src){const sc=document.createElement("div");sc.style.cssText="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px";sc.innerHTML=`<img src="${src}" style="max-width:100%;max-height:100%;border-radius:8px"><div style="position:absolute;top:calc(var(--top) + 14px);right:18px;color:#fff;font-size:28px">✕</div>`;sc.onclick=()=>sc.remove();document.body.appendChild(sc)}

/* ============ Importar extracto (CSV de imagin / CaixaBank) ============ */
function pickCSV(){const i=document.createElement("input");i.type="file";i.accept=".csv,text/csv,text/plain,text/comma-separated-values,*/*";i.onchange=()=>{if(i.files[0])importCSV(i.files[0])};document.body.appendChild(i);i.click();setTimeout(()=>i.remove(),60000)}
function parseImagin(text){
  const lines=text.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
  const num=v=>parseAmt(String(v).replace(/EUR/i,""));
  let balance=null,rows=[],inRows=false;
  for(let i=0;i<lines.length;i++){
    const c=lines[i].split(";");
    if(/^IBAN$/i.test(c[0])&&lines[i+1]){const n=lines[i+1].split(";");balance=num(n[1]);continue}
    if(/^Concepto$/i.test(c[0])&&/Fecha/i.test(c[1])){inRows=true;continue}
    if(inRows&&c.length>=3&&/^\d{2}\/\d{2}\/\d{4}$/.test(c[1])){const [d,m,y]=c[1].split("/");rows.push({concept:c[0].trim(),date:`${y}-${m}-${d}`,amount:num(c[2])})}
  }
  return{balance,rows};
}
async function importCSV(file){
  try{
    let text=await file.text();
    if(text.includes("\ufffd")){try{text=new TextDecoder("windows-1252").decode(await file.arrayBuffer())}catch(e){}}
    const {balance,rows}=parseImagin(text);
    if(!rows.length){toast("No encuentro movimientos en ese archivo");return}
    const seen={};let added=0,linked=0;const touched=new Set();let last="";
    for(const r of rows.slice().reverse()){
      const key=r.date+"|"+r.amount+"|"+norm(r.concept);seen[key]=(seen[key]||0)+1;
      const id="csv:"+key+"#"+seen[key];
      if(r.date>last)last=r.date;
      if(S.txs.some(x=>x.id===id||x.bankId===id))continue;
      const type=r.amount<0?"exp":"inc",amount=Math.abs(r.amount);if(!amount)continue;
      const dd=new Date(r.date).getTime();
      const man=S.txs.find(x=>(x.src==="manual"||x.src==="quick")&&!x.bankId&&x.type===type&&Math.abs(x.amount-amount)<0.01&&Math.abs(new Date(x.date).getTime()-dd)<=4*864e5);
      if(man){man.bankId=id;linked++;continue}
      const g=classify(r.concept,type);
      const tx={id,bankId:id,type,amount,cat:g.cat,note:prettify(r.concept),date:r.date,src:"import",ts:dd,created:0,review:!g.sure,raw:r.concept};
      const fx=g.fixedId?S.fixed.find(f=>f.id===g.fixedId):S.fixed.find(f=>(f.type||"exp")===type&&f.match&&(" "+norm(r.concept)+" ").includes(" "+norm(f.match)+" "));
      if(fx){tx.fixedId=fx.id;tx.cat=fx.cat;tx.review=false;touched.add(fx.id+"|"+ymOf(r.date))}
      S.txs.push(tx);added++;
    }
    // quitar los fijos «auto» que ahora tienen el cargo real del banco
    S.txs=S.txs.filter(t=>!(t.src==="auto"&&!t.ext&&touched.has(t.fixedId+"|"+ymOf(t.date))));
    if(balance!=null)S.settings.balance={amount:balance,ts:Date.now(),date:todayISO()};
    S.settings.csvDate=last;
    relinkFixed();applyAutoLimits();save();render();
    toast(`${added} movimientos importados${linked?` · ${linked} ya los tenías`:""}${balance!=null?` · saldo ${money(balance)}`:""}`);
  }catch(e){toast("No se pudo leer el archivo: "+e.message)}
}

/* ============ Android (Capacitor) ============ */
const Cap=window.Capacitor;
const isNative=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
const plug=n=>isNative?(Cap.Plugins&&Cap.Plugins[n])||(Cap.registerPlugin&&Cap.registerPlugin(n)):null;
const QuickAdd=plug("QuickAdd"),AppP=plug("App"),BrowserP=plug("Browser"),FS=plug("Filesystem"),ShareP=plug("Share");
const REDIRECT_DEFAULT="__REDIRECT_URL__";
let pushT;
const mondayISO=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
/** Lo gastado esta semana (día a día, neto de devoluciones) y cómo van tus límites. */
function weekData(){
  const start=mondayISO();let spent=0;
  for(const t of S.txs){if(t.date<start||t.fixedId||t.goal||isSaving(t))continue;if(t.type==="exp")spent+=t.amount;else if(isRefund(t))spent-=t.amount}
  const ym=curYM(),lims=catsOf("exp").filter(c=>+c.budget>0).map(c=>({c,left:c.budget-spentCat(ym,c.id)}));
  const tight=lims.filter(l=>l.left<l.c.budget*0.25).sort((a,b)=>a.left-b.left).slice(0,2);
  const text=tight.length?tight.map(l=>l.left<0?`Te has pasado en ${l.c.name.toLowerCase()} (${money0(-l.left)}).`:`Ojo con ${l.c.name.toLowerCase()}: te quedan ${money0(l.left)}.`).join(" "):(lims.length?"Vas bien en todos tus límites 👍":"");
  return{start,spent:Math.max(0,spent),text};
}
function pushNative(){
  if(!QuickAdd)return;clearTimeout(pushT);
  pushT=setTimeout(()=>{
    const ym=curYM(),P=plan(ym);
    const wk=weekData();
    const catsJ=JSON.stringify(S.cats.filter(c=>!c.saving&&!["hipoteca","comunidad"].includes(c.id)).map(c=>({id:c.id,name:c.name,icon:c.icon,type:c.type})));
    QuickAdd.updateSummary({cats:catsJ,weekStart:wk.start,weekSpent:+wk.spent.toFixed(2),weekCats:wk.text,ym,hasPlan:P.has,canSpend:+P.canSpend.toFixed(2),spendable:+P.spendable.toFixed(2),goal:+P.goal.toFixed(2),goalName:S.settings.goalName||"Ahorro",
      text:P.has?"":`Este mes llevas ${money0(P.exp)} gastados`}).catch(()=>{});
  },300);
}
/** Recoge lo anotado desde la notificación o el widget. Solo se borra allí cuando ya está guardado aquí. */
let taking=false;
async function takePending(){
  if(!QuickAdd||taking)return;taking=true;
  try{
    const r=await (QuickAdd.peekPending?QuickAdd.peekPending():QuickAdd.takePending());
    const items=JSON.parse((r&&r.items)||"[]");if(!items.length)return;
    let n=0,maxTs=0;
    for(const it of items){
      maxTs=Math.max(maxTs,+it.ts||0);
      const id="q"+it.ts;if(S.txs.some(t=>t.id===id))continue;
      const type=it.type==="inc"?"inc":"exp";
      const chosen=it.cat&&S.cats.some(c=>c.id===it.cat&&c.type===type)?it.cat:null;
      const g=chosen?{cat:chosen,sure:true}:classify(it.note,type);
      S.txs.push({id,type,amount:Math.round((+it.amount)*100)/100,cat:g.cat,note:it.note||"",date:iso(new Date(+it.ts)),src:"quick",ts:+it.ts,created:+it.ts,review:!g.sure&&!!it.note});n++;
    }
    save();
    if(QuickAdd.ackPending)await QuickAdd.ackPending({upTo:maxTs});
    if(n){render();toast(`${n} anotación${n>1?"es":""} desde la notificación ✓`)}
  }catch(e){console.error("takePending",e)}
  finally{taking=false}
}

/* ============ Enable Banking ============ */
const EB="https://api.enablebanking.com";
const b64u=buf=>{const b=buf instanceof ArrayBuffer?new Uint8Array(buf):buf;let s="";for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const b64uStr=s=>b64u(new TextEncoder().encode(s));
function derLen(n){if(n<128)return[n];const a=[];while(n>0){a.unshift(n&255);n>>=8}return[0x80|a.length,...a]}
function pkcs1to8(p1){const algo=[0x30,0x0d,0x06,0x09,0x2a,0x86,0x48,0x86,0xf7,0x0d,0x01,0x01,0x01,0x05,0x00];const oct=[0x04,...derLen(p1.length),...p1];const body=[0x02,0x01,0x00,...algo,...oct];return new Uint8Array([0x30,...derLen(body.length),...body])}
let keyCache={pem:"",key:null};
async function getKey(pem){
  if(keyCache.pem===pem&&keyCache.key)return keyCache.key;
  const isP1=/BEGIN RSA PRIVATE KEY/.test(pem);
  const b=atob(pem.replace(/-----[^-]+-----/g,"").replace(/\s+/g,""));
  let der=Uint8Array.from(b,c=>c.charCodeAt(0));if(isP1)der=pkcs1to8(der);
  const key=await crypto.subtle.importKey("pkcs8",der,{name:"RSASSA-PKCS1-v1_5",hash:"SHA-256"},false,["sign"]);
  keyCache={pem,key};return key;
}
async function jwt(){
  const B=S.bank;if(!B.appId||!B.pem)throw new Error("Falta el ID de la aplicación o la clave");
  const now=Math.floor(Date.now()/1000);
  const h=b64uStr(JSON.stringify({typ:"JWT",alg:"RS256",kid:B.appId}));
  const p=b64uStr(JSON.stringify({iss:"enablebanking.com",aud:"api.enablebanking.com",iat:now,exp:now+3600}));
  const sig=await crypto.subtle.sign("RSASSA-PKCS1-v1_5",await getKey(B.pem),new TextEncoder().encode(h+"."+p));
  return h+"."+p+"."+b64u(sig);
}
async function ebFetch(path,body){
  const r=await fetch(EB+path,{method:body?"POST":"GET",headers:{"Authorization":"Bearer "+await jwt(),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const m=(d&&(d.message||d.detail||d.error))||("HTTP "+r.status);const err=new Error(typeof m==="string"?m:JSON.stringify(m));err.status=r.status;throw err}
  return d;
}
async function bankAuth(aspsp,maxSec){
  try{
    const days=Math.min(180,maxSec?Math.floor(maxSec/86400):90);
    const state=uid();S.bank.pendingState=state;S.bank.aspsp=aspsp;S.bank.maxValidity=maxSec;save();
    const r=await ebFetch("/auth",{access:{balances:true,transactions:true,valid_until:new Date(Date.now()+days*864e5).toISOString()},aspsp:{name:aspsp,country:"ES"},state,redirect_url:S.bank.redirect||REDIRECT_DEFAULT,psu_type:"personal",language:"es"});
    if(BrowserP)await BrowserP.open({url:r.url});else location.href=r.url;
    renderAjustes();
  }catch(e){toast("No se pudo conectar: "+e.message)}
}
async function handleAuthUrl(url){
  try{
    const u=new URL(url.trim().replace(/^miscuentas:\/\//,"https://x/"));
    const code=u.searchParams.get("code"),err=u.searchParams.get("error");
    if(err){toast("El banco devolvió: "+(u.searchParams.get("error_description")||err));return}
    if(!code){toast("No encuentro el código en esa dirección");return}
    try{BrowserP&&await BrowserP.close()}catch(e){}
    toast("Conectando con tu banco…");
    const r=await ebFetch("/sessions",{code});
    S.bank.sessionId=r.session_id;S.bank.validUntil=r.access&&r.access.valid_until||"";S.bank.pendingState="";
    const old=S.bank.accounts||[];
    S.bank.accounts=(r.accounts||[]).map(a=>{const o=old.find(x=>x.iban&&x.iban===(a.account_id&&a.account_id.iban));return{uid:a.uid,name:a.name||a.product||"Cuenta",iban:a.account_id&&a.account_id.iban||"",balance:null,lastDate:o?o.lastDate:""}});
    save();go("ajustes");toast("¡Banco conectado! Bajando movimientos…");
    await bankSync(true);
  }catch(e){toast("Error al conectar: "+e.message)}
}
let syncing=false;
async function bankSync(manual){
  const B=S.bank;if(!isNative||!B.sessionId||syncing)return;
  if(!manual&&Date.now()-B.lastSync<4*3600e3)return;
  syncing=true;render();
  let added=0,matched=0,newest="";
  try{
    for(const acc of B.accounts){
      try{const bl=await ebFetch(`/accounts/${acc.uid}/balances`);const pref=["CLAV","ITAV","XPCD","ITBD","CLBD","OPAV","VALU","PRCD"];
        const list=bl.balances||[];list.sort((a,b)=>(pref.indexOf(a.balance_type)+99)%99-(pref.indexOf(b.balance_type)+99)%99);
        if(list[0]){acc.balance=parseFloat(list[0].balance_amount.amount);S.bank.balanceDate=todayISO()}}catch(e){if(e.status===401||e.status===403)throw e}
      const from=acc.lastDate?iso(new Date(new Date(acc.lastDate).getTime()-7*864e5)):iso(new Date(Date.now()-90*864e5));
      let ck="",guard=0;
      do{
        const q=`date_from=${from}`+(ck?`&continuation_key=${encodeURIComponent(ck)}`:"");
        const r=await ebFetch(`/accounts/${acc.uid}/transactions?${q}`);
        for(const t of r.transactions||[]){
          if(t.status&&t.status!=="BOOK")continue;
          const date=t.booking_date||t.value_date||t.transaction_date;if(!date)continue;
          let amount=parseFloat(t.transaction_amount&&t.transaction_amount.amount);if(!isFinite(amount))continue;
          const type=(t.credit_debit_indicator==="DBIT"||amount<0)?"exp":"inc";amount=Math.abs(amount);
          const party=type==="exp"?(t.creditor&&t.creditor.name):(t.debtor&&t.debtor.name);
          const info=(t.remittance_information||[]).join(" ");
          const text=[party,info].filter(Boolean).join(" · ").replace(/\s+/g," ").trim();
          const id="b:"+acc.uid.slice(0,8)+":"+(t.entry_reference||t.transaction_id||(date+"|"+amount+"|"+norm(text).slice(0,40)));
          if(S.txs.some(x=>x.id===id||x.bankId===id))continue;
          if(date>newest)newest=date;
          const dd=new Date(date).getTime();
          const manual=S.txs.find(x=>x.src!=="bank"&&!x.bankId&&x.type===type&&Math.abs(x.amount-amount)<0.01&&Math.abs(new Date(x.date).getTime()-dd)<=4*864e5);
          if(manual){manual.bankId=id;matched++;continue}
          const g=classify(text,type);
          const tx={id,type,amount,cat:g.cat,note:prettify(party||info||"Movimiento"),date,src:"bank",acc:acc.uid,ts:dd,created:Date.now(),review:!g.sure,raw:text.slice(0,200)};
          const fx=g.fixedId?S.fixed.find(f=>f.id===g.fixedId):S.fixed.find(f=>(f.type||"exp")===type&&f.match&&(" "+norm(text)+" ").includes(" "+norm(f.match)+" "));
          if(fx&&!fixedPaid(fx,ymOf(date))){tx.fixedId=fx.id;tx.cat=fx.cat;tx.review=false}
          S.txs.push(tx);added++;
        }
        ck=r.continuation_key||"";
      }while(ck&&++guard<20);
      if(newest&&(!acc.lastDate||newest>acc.lastDate))acc.lastDate=newest;
    }
    B.lastSync=Date.now();save();
    if(manual||added)toast(added?`${added} movimiento${added>1?"s":""} nuevo${added>1?"s":""} del banco${matched?` · ${matched} ya los tenías`:""}`:"Todo al día ✓");
  }catch(e){
    if(e.status===401||e.status===403||/expired|session/i.test(e.message))toast("El permiso del banco ha caducado. Renuévalo en Ajustes.");
    else if(manual)toast("No se pudo actualizar: "+e.message);
  }finally{syncing=false;render()}
}
function prettify(s){s=String(s).replace(/\s+/g," ").trim();if(s===s.toUpperCase())s=s.toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());return s.slice(0,60)}

  }
